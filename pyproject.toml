[project]
name = "talk-with-your-data"
version = "0.1.0"
description = "Eraneos assignment: a bot that answers questions about the Olist shop data through a clean layer, a Jev gate and Claude."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=25",
    "fastembed>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: needs .env and the real Claude, Jev or Docker",
]
